<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#f6f8fc}svg{display:block}</style>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Segoe UI, system-ui, sans-serif">
<rect width="1200" height="1200" fill="#f6f8fc"/>
<text x="70" y="110" font-size="58" font-weight="800" fill="#14171c">Fewer compute units,</text>
<text x="70" y="178" font-size="58" font-weight="800" fill="#1d5fd1">same traffic.</text>
<text x="70" y="232" font-size="26" fill="#5b6472">Why Pocket's compute-unit total can fall while usage has not changed.</text>

<rect x="70" y="270" width="1060" height="96" rx="20" fill="#e9f0fd"/>
<text x="600" y="330" font-size="34" font-weight="700" fill="#14171c" text-anchor="middle">compute units  =  relays  ×  CUPR</text>

<!-- relays card -->
<rect x="70" y="400" width="510" height="470" rx="24" fill="#fff" stroke="#dfe3ea" stroke-width="2"/>
<text x="110" y="456" font-size="28" font-weight="700" fill="#14171c">Relays served</text>
<text x="110" y="490" font-size="21" fill="#5b6472">what users actually sent</text>
<rect x="150" y="560" width="140" height="240" rx="12" fill="#35b38a"/>
<rect x="360" y="560" width="140" height="240" rx="12" fill="#35b38a"/>
<text x="220" y="545" font-size="26" font-weight="700" fill="#14171c" text-anchor="middle">1,000,000</text>
<text x="430" y="545" font-size="26" font-weight="700" fill="#14171c" text-anchor="middle">1,000,000</text>
<text x="220" y="838" font-size="21" fill="#5b6472" text-anchor="middle">CUPR 5,000</text>
<text x="430" y="838" font-size="21" fill="#5b6472" text-anchor="middle">CUPR 1,579</text>
<circle cx="325" cy="680" r="26" fill="#f6f8fc" stroke="#35b38a" stroke-width="3"/>
<text x="325" y="691" font-size="30" font-weight="800" fill="#1f8a67" text-anchor="middle">=</text>

<!-- CU card -->
<rect x="620" y="400" width="510" height="470" rx="24" fill="#fff" stroke="#dfe3ea" stroke-width="2"/>
<text x="660" y="456" font-size="28" font-weight="700" fill="#14171c">Compute units reported</text>
<text x="660" y="490" font-size="21" fill="#5b6472">what the dashboard adds up</text>
<rect x="700" y="560" width="140" height="240" rx="12" fill="#1d5fd1"/>
<rect x="910" y="724" width="140" height="76" rx="12" fill="#7fb0ff"/>
<text x="770" y="545" font-size="26" font-weight="700" fill="#14171c" text-anchor="middle">5.00 billion</text>
<text x="980" y="709" font-size="26" font-weight="700" fill="#14171c" text-anchor="middle">1.58 billion</text>
<text x="770" y="838" font-size="21" fill="#5b6472" text-anchor="middle">CUPR 5,000</text>
<text x="980" y="838" font-size="21" fill="#5b6472" text-anchor="middle">CUPR 1,579</text>
<rect x="925" y="590" width="110" height="50" rx="25" fill="#fde9e7"/>
<text x="980" y="624" font-size="26" font-weight="800" fill="#c2412d" text-anchor="middle">−68%</text>

<!-- takeaway -->
<rect x="70" y="904" width="1060" height="150" rx="24" fill="#14171c"/>
<text x="110" y="962" font-size="30" font-weight="700" fill="#fff">Comparing activity across a repricing? Count relays.</text>
<text x="110" y="1004" font-size="22" fill="#c9d2e0">Compute units also set the cost: in this example the POKT burned for the</text>
<text x="110" y="1034" font-size="22" fill="#c9d2e0">same million relays goes from 765.78 to 241.83.</text>

<text x="70" y="1100" font-size="18" fill="#5b6472">Illustrative example: one service repriced from 5,000 to 1,579 CUPR. EVM services are being standardised to 1,579</text>
<text x="70" y="1126" font-size="18" fill="#5b6472">(Office Hours, 11 Nov 2026). Checked on MainNet 13 Nov 2026: eth = 1,579 CUPR; compute_units_to_tokens_multiplier = 153,156</text>
<text x="70" y="1152" font-size="18" fill="#5b6472">upokt per million CU.  pocketd query service show-service eth · pocketd query shared params · docs.pocket.network</text>
<text x="1130" y="1180" font-size="18" fill="#9aa4b2" text-anchor="end">made by jsymen</text>
</svg>
